name = "portwatch"
main = "src/index.ts"
compatibility_date = "2026-01-25"
workers_dev = true
preview_urls = false

[triggers]
crons = ["* * * * *"]

[vars]
# Public ports to probe (TCP connect).
PORTWATCH_PORTS = "443,30413"

# Alerting behavior. The Worker runs once per minute.
PORTWATCH_FAILURE_THRESHOLD = "3"
PORTWATCH_REPEAT_INTERVAL_SECONDS = "43200" # 12h

# TCP connect timeout per port probe.
PORTWATCH_CONNECT_TIMEOUT_MS = "5000"

[[kv_namespaces]]
binding = "PORTWATCH_KV"
id = "646291b05078418fa45bd444866af847"
