---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: qbittorrent-dashboard
    files:
      - qbittorrent-dashboard.json=./resources/qbittorrent-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
  - name: openwrt-router-dashboard
    files:
      - openwrt-router-dashboard.json=./resources/openwrt-router-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"

generatorOptions:
  disableNameSuffixHash: true
