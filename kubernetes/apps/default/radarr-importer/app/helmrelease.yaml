---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr-importer
spec:
  chartRef:
    kind: OCIRepository
    name: radarr-importer
  interval: 1h
  values:
    controllers:
      radarr-importer:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/gravity182/arr-importer
              tag: 0.3.0@sha256:56d15076550e13b65935849523b9e74bee5e5cf37a4d61b61994e0e4223ccf60
            env:
              RADARR_URL: http://radarr.default.svc.cluster.local:7878
              SONARR_URL: http://sonarr.default.svc.cluster.local:8989
              QBITTORRENT_URL: http://qbittorrent.default.svc.cluster.local:8080
              STATE_DB_PATH: /state/imports.sqlite
              RADARR_ROOT_FOLDER: /data/library/movies
              RADARR_DEFAULT_QUALITY_PROFILE_ID: "8"
              SONARR_ROOT_FOLDER: /data/library/tv
              SONARR_DEFAULT_QUALITY_PROFILE_ID: "7"
              OPENAI_MODEL: gpt-5.6-luna
              OPENAI_REASONING_EFFORT: high
              TELEGRAM_CHAT_ID:
                valueFrom:
                  secretKeyRef:
                    name: cluster-secrets
                    key: SECRET_TELEGRAM_CHAT_ID
              LISTEN_ADDRESS: ":8080"
              RECONCILE_INTERVAL_SECONDS: "300"
              LOG_LEVEL: info
            envFrom:
              - secret: radarr-importer
            ports:
              - name: http
                containerPort: &port 8080
                protocol: TCP
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
            securityContext:
              privileged: false
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    persistence:
      state:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        storageClass: openebs-hostpath
        size: 1Gi
        globalMounts:
          - path: /state
    service:
      app:
        controller: radarr-importer
        ports:
          http:
            port: *port
