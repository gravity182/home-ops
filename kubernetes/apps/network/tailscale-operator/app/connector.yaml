---
apiVersion: tailscale.com/v1alpha1
kind: Connector
metadata:
  name: homeserver-subnet
spec:
  subnetRouter:
    advertiseRoutes:
      - 192.168.10.1/32  # router openwrt
      - 192.168.10.10/32 # talos-node
      - 192.168.10.50/32 # k8s control-plane
      - 192.168.10.51/32 # envoy-external
      - 192.168.10.52/32 # envoy-internal
