---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-gpu-resource-driver
spec:
  chartRef:
    kind: OCIRepository
    name: intel-gpu-resource-driver
  interval: 1h
  values:
    kubeletPlugin:
      healthMonitoring:
        # Hardware health monitoring requires xpumd, which is not deployed.
        enabled: false
    cdi:
      staticPath: /var/cdi/static
      dynamicPath: /var/cdi/dynamic
